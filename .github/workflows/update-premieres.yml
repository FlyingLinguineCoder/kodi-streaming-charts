
name: Audit upcoming streaming premieres

on:
  workflow_run:
    workflows: ["Update streaming charts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: movie-premieres-${{ github.ref }}
  cancel-in-progress: false

# Testing only: do not publish changes.
permissions:
  contents: read

jobs:
  audit-premieres:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and audit upcoming premieres
        id: audit
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python scripts/update_premieres.py

      - name: Build the movie-only Kodi feed
        id: widget
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        env:
          MOVIE_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: lxml==6.1.1
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_upcoming_movies.py
          python scripts/enrich_upcoming_movies.py

      - name: Report synopsis test results
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("charts/upcoming_movies.json")

          if not path.exists():
              print("Movie premiere feed was not generated.")
              raise SystemExit(1)

          movies = json.loads(path.read_text(encoding="utf-8"))

          enriched = [
              movie for movie in movies
              if movie.get("mediatype") == "movie"
              and "\n\nU.S. subscription premiere on " in movie.get("description", "")
          ]

          missing = [
              movie for movie in movies
              if movie.get("mediatype") == "movie"
              and "\n\nU.S. subscription premiere on " not in movie.get("description", "")
          ]

          print(f"Total upcoming movies: {len(movies)}")
          print(f"Movies with plot synopses: {len(enriched)}")
          print(f"Movies without plot synopses: {len(missing)}")

          print("\nMOVIES MISSING SYNOPSES:")

          if not missing:
              print("None!")
          else:
              for movie in missing:
                  title = movie.get("title", "(untitled)")
                  ident = movie.get("id", "?")
                  date = movie.get("premiere_date", "?")
                  services = ", ".join(movie.get("services", []))

                  print(
                      f"- {title} | TMDb {ident} | "
                      f"{date} | {services}"
                  )

          print("\nSAMPLE COMPLETED DESCRIPTIONS:")

          for movie in enriched[:5]:
              print(f"\n{movie['title']}")
              print(movie["description"])

          if not enriched:
              print("TEST INCOMPLETE: No verified movie synopses retrieved.")
              raise SystemExit(1)

          print("\nLIVE SYNOPSIS TEST PASSED")
          PY

      # Testing only: no commits or pushes.
      # Published widgets and streaming charts remain unchanged.
