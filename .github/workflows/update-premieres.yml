
name: Audit upcoming streaming premieres

on:
  workflow_run:
    workflows: ["Update streaming charts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: movie-premieres-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-premieres:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and audit upcoming premieres
        id: audit
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python scripts/update_premieres.py

      - name: Build and enrich the movie-only Kodi feed
        id: widget
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        env:
          MOVIE_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: lxml==6.1.1
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_upcoming_movies.py
          python scripts/enrich_upcoming_movies.py

      - name: Report movie synopsis coverage
        if: ${{ steps.widget.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          movies = json.loads(
              Path("charts/upcoming_movies.json").read_text(encoding="utf-8")
          )

          enriched = [
              movie for movie in movies
              if movie.get("mediatype") == "movie"
              and "\n\nU.S. subscription premiere on " in movie.get("description", "")
          ]

          print(f"Total upcoming movies: {len(movies)}")
          print(f"Movies with plot synopses: {len(enriched)}")
          print(f"Movies without plot synopses: {len(movies) - len(enriched)}")
          PY

      - name: Save premiere audit and movie widget
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.widget.outcome == 'success') }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          WIDGET_OUTCOME: ${{ steps.widget.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$AUDIT_OUTCOME" == success ]]; then
            git add charts/premieres_audit.json charts/premieres_seen_on_streaming.json
          fi

          if [[ "$WIDGET_OUTCOME" == success && -f charts/upcoming_movies.json ]]; then
            git add charts/upcoming_movies.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update upcoming movie premieres"

            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            done

            exit 1
          fi
