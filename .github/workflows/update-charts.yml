
name: Update streaming charts

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Retrieve and build streaming charts
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python scripts/update_charts.py

      - name: Test Disney Plus and Hulu calendars
        id: disney_hulu
        continue-on-error: true
        run: python scripts/test_disney_hulu.py

      - name: Report diagnostic outcome
        if: steps.disney_hulu.outcome == 'failure'
        run: |
          echo "::warning::Disney Plus and Hulu diagnostic failed."
          echo "Existing streaming charts will still be saved."

      - name: Save updated chart files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update streaming charts"
            git push
          fi
