
name: Test official Netflix premiere sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-netflix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Netflix premiere evidence
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import date
          from html.parser import HTMLParser

          URLS = {
              "calendar": (
                  "https://www.netflix.com/tudum/"
                  "articles/new-on-netflix"
              ),
              "lineup": (
                  "https://www.netflix.com/tudum/"
                  "articles/new-movies-on-netflix-2026"
              ),
              "fall": (
                  "https://www.netflix.com/tudum/"
                  "features/new-fall-movies-on-netflix-2026"
              ),
          }

          MONTHS = (
              "January February March April May June "
              "July August September October "
              "November December"
          ).split()

          MONTH_BY_NAME = {
              month.upper(): number
              for number, month in enumerate(
                  MONTHS, 1
              )
          }

          MONTH_BY_SHORT = {
              month[:3].upper(): number
              for number, month in enumerate(
                  MONTHS, 1
              )
          }

          def normalize(value):
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value.casefold()
              ).strip()

          def load_html(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html",
                  },
              )

              with urllib.request.urlopen(
                  request, timeout=40
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          class PageText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.events = []
                  self.heading = None
                  self.heading_parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in (
                      "script", "style",
                      "noscript", "svg"
                  ):
                      self.skip += 1

                  if (
                      not self.skip
                      and not self.heading
                      and tag in ("h1", "h2", "h3")
                  ):
                      self.heading = tag
                      self.heading_parts = []

              def handle_data(self, value):
                  if self.skip:
                      return

                  value = " ".join(
                      value.split()
                  )

                  if not value:
                      return

                  if self.heading:
                      self.heading_parts.append(
                          value
                      )
                  else:
                      self.events.append(
                          ("text", value)
                      )

              def handle_endtag(self, tag):
                  if tag == self.heading:
                      title = " ".join(
                          self.heading_parts
                      )

                      if title:
                          self.events.append(
                              (tag, title)
                          )

                      self.heading = None
                      self.heading_parts = []

                  if tag in (
                      "script", "style",
                      "noscript", "svg"
                  ):
                      self.skip = max(
                          0, self.skip - 1
                      )

          def page_events(html):
              page = PageText()
              page.feed(html)
              return page.events

          def parse_calendar(events):
              h1 = " ".join(
                  value
                  for tag, value in events
                  if tag == "h1"
              )

              year_match = re.search(
                  r"New on Netflix in\s+"
                  r"[A-Za-z]+\s+(20\d{2})",
                  h1,
                  re.IGNORECASE
              )

              if not year_match:
                  raise ValueError(
                      "Netflix calendar year "
                      "could not be identified"
                  )

              year = int(
                  year_match.group(1)
              )

              current_day = None
              results = {}

              date_re = re.compile(
                  rf"^({'|'.join(MONTHS)})"
                  r"\s+(\d{1,2})$",
                  re.IGNORECASE
              )

              for tag, value in events:
                  if tag == "h2":
                      match = date_re.fullmatch(
                          value
                      )

                      current_day = None

                      if match:
                          month = MONTH_BY_NAME[
                              match.group(1).upper()
                          ]

                          try:
                              current_day = date(
                                  year,
                                  month,
                                  int(match.group(2))
                              ).isoformat()

                          except ValueError:
                              pass

                  elif (
                      tag == "h3"
                      and current_day
                  ):
                      results[
                          normalize(value)
                      ] = current_day

              return results

          def parse_fall_guide(events):
              section_month = None
              pending_date = None
              recent = []
              results = {}

              for tag, value in events:
                  upper = value.upper()

                  if tag in ("h1", "h2", "h3"):
                      if upper in MONTH_BY_NAME:
                          section_month = (
                              MONTH_BY_NAME[upper]
                          )
                          pending_date = None

                      elif upper in (
                          "COMING SOON",
                          "RELATED STORIES",
                          "LATEST NEWS"
                      ):
                          section_month = None
                          pending_date = None

                      elif (
                          tag == "h3"
                          and section_month
                          and pending_date
                      ):
                          results[
                              normalize(value)
                          ] = pending_date

                          pending_date = None

                      recent = []

                  elif (
                      tag == "text"
                      and section_month
                  ):
                      recent = (
                          recent + [value]
                      )[-3:]

                      for index in range(
                          len(recent)
                      ):
                          text = " ".join(
                              recent[index:]
                          )

                          match = re.fullmatch(
                              r"([A-Za-z]{3})"
                              r"\.?\s*(\d{1,2})",
                              text
                          )

                          if (
                              match
                              and MONTH_BY_SHORT.get(
                                  match.group(1).upper()
                              ) == section_month
                          ):
                              try:
                                  pending_date = date(
                                      2026,
                                      section_month,
                                      int(match.group(2))
                                  ).isoformat()

                              except ValueError:
                                  pass

                              break

              return results

          def main():
              pages = {}

              for label, url in URLS.items():
                  print(
                      f"Fetching Netflix {label}: "
                      f"{url}",
                      flush=True
                  )

                  html = load_html(url)

                  pages[label] = (
                      page_events(html)
                  )

                  print(
                      f"Retrieved {len(html)} "
                      f"HTML characters"
                  )

              monthly = parse_calendar(
                  pages["calendar"]
              )

              slate = {
                  normalize(text)
                  for tag, text in pages["lineup"]
                  if tag == "h3"
              }

              fall = parse_fall_guide(
                  pages["fall"]
              )

              print(
                  f"Calendar dated entries: "
                  f"{len(monthly)}"
              )

              print(
                  f"Movie lineup headings: "
                  f"{len(slate)}"
              )

              print(
                  f"Fall guide dated entries: "
                  f"{len(fall)}"
              )

              if len(fall) < 3:
                  raise RuntimeError(
                      "Fall guide parser yielded "
                      "too few dated titles"
                  )

              for title in (
                  "In a Holidaze",
                  "La bola negra",
                  "14th"
              ):
                  print(
                      f"Fall guide spot check: "
                      f"{title} = "
                      f"{fall.get(normalize(title), 'missing')}"
                  )

              with open(
                  "charts/premieres_audit.json",
                  encoding="utf-8"
              ) as file:
                  audit = json.load(file)

              candidates = [
                  item
                  for item in audit.get(
                      "candidates", []
                  )
                  if "netflix" in item.get(
                      "streaming_dates", {}
                  )
              ]

              counts = {}

              print(
                  "\nNETFLIX PREMIERE EVIDENCE"
              )

              for item in candidates:
                  title = item["title"]

                  expected = item[
                      "streaming_dates"
                  ]["netflix"]

                  month_date = monthly.get(
                      normalize(title)
                  )

                  fall_date = fall.get(
                      normalize(title)
                  )

                  on_slate = (
                      normalize(title) in slate
                  )

                  official_dates = {
                      day
                      for day in (
                          month_date, fall_date
                      )
                      if day
                  }

                  if len(official_dates) > 1:
                      status = (
                          "OFFICIAL DATE CONFLICT"
                      )

                  elif (
                      official_dates
                      and expected not in official_dates
                  ):
                      status = (
                          "GALAXY DATE CONFLICT"
                      )

                  elif fall_date:
                      status = (
                          "FALL MOVIE GUIDE DATE MATCH"
                      )

                  elif month_date and on_slate:
                      status = (
                          "CALENDAR + MOVIE LINEUP MATCH"
                      )

                  elif month_date:
                      status = (
                          "CALENDAR ARRIVAL ONLY"
                      )

                  elif on_slate:
                      status = (
                          "LINEUP ONLY - "
                          "DATE UNCONFIRMED"
                      )

                  else:
                      status = (
                          "NO OFFICIAL MATCH"
                      )

                  counts[status] = (
                      counts.get(status, 0) + 1
                  )

                  print(
                      f"{title}"
                      f" | Galaxy: {expected}"
                      f" | Calendar: {month_date}"
                      f" | Fall guide: {fall_date}"
                      f" | Lineup: {on_slate}"
                      f" | {status}"
                  )

              print(
                  f"\nMovies checked: "
                  f"{len(candidates)}"
              )

              for status, count in sorted(
                  counts.items()
              ):
                  print(
                      f"{status}: {count}"
                  )

              print(
                  "Read-only test. Matches are "
                  "evidence, not proof of a "
                  "first-ever streaming premiere."
              )

          if __name__ == "__main__":
              main()
          PY
