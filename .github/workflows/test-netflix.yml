
name: Test official Netflix premiere sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-netflix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Netflix announcement pages
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser

          URLS = {
              "Netflix monthly releases":
                  "https://www.netflix.com/tudum/articles/new-on-netflix",
              "Netflix original movies":
                  "https://www.netflix.com/tudum/articles/new-movies-on-netflix-2026",
          }

          class PageReader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.headings = []
                  self.heading = None
                  self.heading_parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1
                  if tag in ("h1", "h2", "h3"):
                      self.heading = tag
                      self.heading_parts = []

              def handle_data(self, data):
                  if self.skip:
                      return
                  self.parts.append(data)
                  if self.heading:
                      self.heading_parts.append(data)

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)
                  if tag == self.heading:
                      value = " ".join(
                          " ".join(self.heading_parts).split()
                      )
                      if value:
                          self.headings.append(value)
                      self.heading = None

              def text(self):
                  return " ".join(
                      " ".join(self.parts).split()
                  )

          def normalize(value):
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value.casefold()
              ).strip()

          pages = {}

          for name, url in URLS.items():
              print(f"\nChecking: {name}")

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      html = response.read().decode(
                          "utf-8", errors="replace"
                      )

                  parser = PageReader()
                  parser.feed(html)

                  pages[name] = {
                      "text": parser.text(),
                      "headings": parser.headings,
                  }

                  print(
                      f"HTML received: {len(html)} characters"
                  )
                  print(
                      f"Visible headings: {len(parser.headings)}"
                  )

              except Exception as error:
                  print(
                      "Unable to retrieve page: "
                      + type(error).__name__
                  )

                  pages[name] = {
                      "text": "",
                      "headings": [],
                  }

          with open(
              "charts/premieres_audit.json",
              encoding="utf-8"
          ) as file:
              audit = json.load(file)

          candidates = [
              item
              for item in audit.get("candidates", [])
              if "netflix" in item.get(
                  "streaming_dates", {}
              )
          ]

          print("\nNETFLIX MOVIE CANDIDATES")
          print(f"Candidates found: {len(candidates)}")

          matches = 0

          for movie in candidates:
              title = movie["title"]
              key = normalize(title)

              found = []

              for source, page in pages.items():
                  content = normalize(page["text"])

                  if key and key in content:
                      found.append(source)

              if found:
                  matches += 1

              print(
                  f"{title} | "
                  f"Found in: {', '.join(found) or 'None'}"
              )

          print("\nSUMMARY")
          print(f"Movies checked: {len(candidates)}")
          print(f"Title matches: {matches}")

          if not any(
              page["text"] for page in pages.values()
          ):
              raise SystemExit(
                  "Netflix pages could not be read"
              )

          print(
              "Source test completed. "
              "Title mentions are not premiere verification."
          )
          PY
