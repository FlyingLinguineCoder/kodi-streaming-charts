
name: Test official Netflix premiere sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-netflix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Netflix dates and movie lineup
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import date
          from html.parser import HTMLParser

          CALENDAR_URL = (
              "https://www.netflix.com/tudum/"
              "articles/new-on-netflix"
          )

          SLATE_URL = (
              "https://www.netflix.com/tudum/"
              "articles/new-movies-on-netflix-2026"
          )

          MONTHS = (
              "January February March April May June "
              "July August September October "
              "November December"
          ).split()

          DATE_PATTERN = re.compile(
              rf"^({'|'.join(MONTHS)})\s+(\d{{1,2}})$"
          )

          def normalize(value):
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value.casefold()
              ).strip()

          def load_page(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html",
                  },
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          class Headings(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items = []
                  self.active = None
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

                  if (
                      not self.skip
                      and self.active is None
                      and tag in ("h1", "h2", "h3")
                  ):
                      self.active = tag
                      self.parts = []

              def handle_data(self, value):
                  if not self.skip and self.active:
                      self.parts.append(value)

              def handle_endtag(self, tag):
                  if tag == self.active:
                      title = " ".join(
                          " ".join(self.parts).split()
                      )

                      if title:
                          self.items.append(
                              (tag, title)
                          )

                      self.active = None
                      self.parts = []

                  if tag in ("script", "style"):
                      self.skip = max(
                          0, self.skip - 1
                      )

          def parse_calendar(html):
              headings = Headings()
              headings.feed(html)

              heading_text = " ".join(
                  text
                  for tag, text in headings.items
                  if tag == "h1"
              )

              year_match = re.search(
                  r"New on Netflix in\s+"
                  r"[A-Za-z]+\s+(20\d{2})",
                  heading_text,
                  re.IGNORECASE
              )

              if not year_match:
                  raise ValueError(
                      "Could not determine "
                      "Netflix calendar year"
                  )

              year = int(year_match.group(1))

              current_date = None
              movies = {}

              for tag, title in headings.items:
                  if tag == "h2":
                      match = DATE_PATTERN.fullmatch(
                          title
                      )

                      current_date = None

                      if match:
                          month = (
                              MONTHS.index(
                                  match.group(1)
                              ) + 1
                          )

                          try:
                              current_date = date(
                                  year,
                                  month,
                                  int(match.group(2))
                              ).isoformat()

                          except ValueError:
                              pass

                  elif tag == "h3" and current_date:
                      movies[
                          normalize(title)
                      ] = current_date

              return movies

          def parse_slate(html):
              headings = Headings()
              headings.feed(html)

              return {
                  normalize(text)
                  for tag, text in headings.items
                  if tag == "h3"
              }

          def main():
              print(
                  "Fetching official Netflix calendar",
                  flush=True
              )

              calendar_html = load_page(
                  CALENDAR_URL
              )

              print(
                  "Fetching official Netflix movie lineup",
                  flush=True
              )

              slate_html = load_page(
                  SLATE_URL
              )

              calendar = parse_calendar(
                  calendar_html
              )

              slate = parse_slate(
                  slate_html
              )

              print(
                  f"Calendar dated entries: "
                  f"{len(calendar)}"
              )

              print(
                  f"Movie lineup headings: "
                  f"{len(slate)}"
              )

              with open(
                  "charts/premieres_audit.json",
                  encoding="utf-8"
              ) as file:
                  audit = json.load(file)

              netflix_movies = [
                  item
                  for item in audit.get(
                      "candidates", []
                  )
                  if "netflix" in item.get(
                      "streaming_dates", {}
                  )
              ]

              summary = {}

              print(
                  "\nNETFLIX MOVIE PREMIERE TEST"
              )

              for item in netflix_movies:
                  title = item["title"]

                  official_day = calendar.get(
                      normalize(title)
                  )

                  expected_day = item[
                      "streaming_dates"
                  ]["netflix"]

                  slate_match = (
                      normalize(title) in slate
                  )

                  if (
                      official_day
                      and official_day != expected_day
                  ):
                      status = "DATE CONFLICT"

                  elif official_day and slate_match:
                      status = (
                          "STRONG ORIGINAL CANDIDATE"
                      )

                  elif official_day:
                      status = (
                          "CALENDAR ARRIVAL ONLY"
                      )

                  elif slate_match:
                      status = (
                          "SLATE ONLY - DATE UNCONFIRMED"
                      )

                  else:
                      status = "NO OFFICIAL MATCH"

                  summary[status] = (
                      summary.get(status, 0) + 1
                  )

                  print(
                      f"\n{title}"
                      f"\n  Galaxy date: {expected_day}"
                      f"\n  Netflix date: "
                      f"{official_day or 'Not found'}"
                      f"\n  Movie lineup: {slate_match}"
                      f"\n  Result: {status}"
                  )

              print("\nFINAL SUMMARY")

              print(
                  f"Netflix movies checked: "
                  f"{len(netflix_movies)}"
              )

              for status, count in sorted(
                  summary.items()
              ):
                  print(f"{status}: {count}")

              print(
                  "\nThis is a read-only evidence test."
                  "\nEven matching both official pages "
                  "does not prove a first-ever "
                  "subscription-streaming premiere."
              )

          if __name__ == "__main__":
              main()
          PY
